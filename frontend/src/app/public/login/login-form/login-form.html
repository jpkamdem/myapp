<div class="h-full flex items-center justify-center">
  <form [formGroup]="formGroup" (submit)="$event.preventDefault(); submit()">
    <div class="form-item">
      <label for="identifier"> Nom d'utilisateur ou adresse mail</label>
      <input
        type="text"
        id="identifier"
        formControlName="identifier"
        inputmode="latin"
        required
      />
    </div>
    <div class="form-item">
      <label for="password"> Mot de passe</label>
      <input
        type="password"
        id="password"
        formControlName="password"
        inputmode="latin"
        required
      />
    </div>
    <div class="form-btn-container">
      <a [routerLink]="['/register']">Pas encore inscrit(e) ? Inscrivez-vous</a>
      <button type="submit">Valider</button>
    </div>
  </form>
</div>
