<div class="h-full flex items-center justify-center">
  <form [formGroup]="formGroup" (submit)="$event.preventDefault(); submit()">
    <div class="form-item">
      <label for="username"> Nom d'utilisateur</label>
      <input
        type="text"
        id="username"
        formControlName="username"
        inputmode="latin"
        required
      />
    </div>
    <div class="form-item">
      <label for="email"> Adresse mail</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        inputmode="email"
        required
      />
    </div>
    <div class="form-item">
      <label for="password"> Mot de passe</label>
      <input
        type="password"
        id="password"
        formControlName="password"
        inputmode="latin"
        required
      />
    </div>
    <div class="form-item">
      <label for="age">Âge</label>
      <input
        type="number"
        id="age"
        formControlName="age"
        inputmode="numeric"
        required
      />
    </div>
    <div class="form-item">
      <label for="phoneNumber"> Numéro de téléphone</label>
      <input
        type="tel"
        id="tel"
        formControlName="phoneNumber"
        inputmode="email"
        required
      />
    </div>
    <div class="form-btn-container">
      <a [routerLink]="['/login']">Déjà inscrit(e) ? Connectez-vous</a>
      <button type="submit" [disabled]="!formGroup.valid">Valider</button>
    </div>
  </form>
</div>
